name: MiningSniper RC16 final immutable artifact gate

on:
  push:
    branches:
      - miningsniper-ci-rc16-final
    paths:
      - '.github/workflows/miningsniper-rc16-final-artifact-gate.yml'
      - 'ci/miningsniper/validate_rc16_final.ps1'

jobs:
  final-artifact-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct immutable RC16 candidate from preserved exact parts
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/cncmolot-wq/MatrixClockS3/miningsniper-ci-r0651/ci/miningsniper/rc16_exact_parts'
          : > RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1
          for p in part00.txt part01.txt part02.txt part03.txt part04.txt; do
            curl -L --fail --retry 3 "$base/$p" >> RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1
          done
          sha256sum RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1 | tee RC16_SHA256.txt
          wc -c RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1

      - name: Install exact PowerShell 7.6.3
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/PowerShell/PowerShell/releases/download/v7.6.3/powershell-7.6.3-linux-x64.tar.gz'
          expected='856d0765d2332377f9d7a4aea76efdfde4de51446e7738dde2dfda41dba9e2a7'
          curl -L --fail --retry 3 -o /tmp/powershell-7.6.3-linux-x64.tar.gz "$url"
          echo "$expected  /tmp/powershell-7.6.3-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pwsh763
          tar -xzf /tmp/powershell-7.6.3-linux-x64.tar.gz -C /tmp/pwsh763
          chmod +x /tmp/pwsh763/pwsh
          test "$(/tmp/pwsh763/pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" = '7.6.3'

      - name: Run exact external RC16 validator
        shell: bash
        run: |
          set -euo pipefail
          /tmp/pwsh763/pwsh -NoProfile -File ci/miningsniper/validate_rc16_final.ps1 -MainPath RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1 -ResultPath FINAL_RC16_EXACT_ARTIFACT_GATE_RESULT.json
          cat FINAL_RC16_EXACT_ARTIFACT_GATE_RESULT.json

      - name: Upload exact validated RC16 artifact and receipts
        uses: actions/upload-artifact@v4
        with:
          name: MiningSniper-RC16-exact-validated
          path: |
            RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1
            RC16_SHA256.txt
            FINAL_RC16_EXACT_ARTIFACT_GATE_RESULT.json
          if-no-files-found: error
