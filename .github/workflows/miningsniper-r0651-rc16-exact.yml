name: MiningSniper R0651 RC16 exact prechat

on:
  push:
    branches:
      - miningsniper-ci-r0651
    paths:
      - 'ci/miningsniper/RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1'
      - '.github/workflows/miningsniper-r0651-rc16-exact.yml'

jobs:
  exact-rc16-prechat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install exact PowerShell 7.6.3
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/PowerShell/PowerShell/releases/download/v7.6.3/powershell-7.6.3-linux-x64.tar.gz'
          expected='856d0765d2332377f9d7a4aea76efdfde4de51446e7738dde2dfda41dba9e2a7'
          curl -L --fail --retry 3 -o /tmp/powershell-7.6.3-linux-x64.tar.gz "$url"
          echo "$expected  /tmp/powershell-7.6.3-linux-x64.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pwsh763
          tar -xzf /tmp/powershell-7.6.3-linux-x64.tar.gz -C /tmp/pwsh763
          chmod +x /tmp/pwsh763/pwsh
          test "$(/tmp/pwsh763/pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')" = '7.6.3'

      - name: Parse exact RC16 and print exact error locations
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parse_rc16.ps1 <<'PWSH'
          param([Parameter(Mandatory)][string]$MainPath)
          $ErrorActionPreference='Stop'
          $tok=$null;$err=$null
          [void][Management.Automation.Language.Parser]::ParseFile($MainPath,[ref]$tok,[ref]$err)
          if($err.Count-gt0){
            $lines=Get-Content -LiteralPath $MainPath
            foreach($e in $err){
              $ln=$e.Extent.StartLineNumber;$col=$e.Extent.StartColumnNumber
              $src=if($ln-ge1-and$ln-le$lines.Count){$lines[$ln-1]}else{''}
              Write-Host ('PARSER_ERROR line='+$ln+' col='+$col+' id='+$e.ErrorId+' text=['+$e.Extent.Text+'] message='+$e.Message)
              Write-Host ('SOURCE['+$ln+'] '+$src)
            }
            throw ('exact RC16 ParseFile failed with '+$err.Count+' error(s)')
          }
          Write-Host 'EXACT_RC16_PARSE_PASS'
          PWSH
          /tmp/pwsh763/pwsh -NoProfile -File /tmp/parse_rc16.ps1 -MainPath ci/miningsniper/RUN_ACTIVATE_R065_GPU_LANE_RC16.ps1
